<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세계 시계</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #ef4444;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 35%);
      color: var(--text);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 48px);
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 20px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 24px;
    }

    select, button, input {
      font: inherit;
    }

    select {
      flex: 1 1 280px;
      min-width: 220px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: var(--surface);
      color: var(--text);
    }

    button {
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .add-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      white-space: nowrap;
    }

    .add-button:hover { background: var(--primary-dark); }

    .clock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .empty-state,
    .clock-card {
      background: var(--surface);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .empty-state {
      padding: 60px 24px;
      text-align: center;
      color: var(--muted);
    }

    .clock-card {
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .clock-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .clock-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .clock-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .remove-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fee2e2;
      color: #b91c1c;
      flex-shrink: 0;
      font-size: 22px;
      line-height: 1;
    }

    .clock-body {
      display: grid;
      gap: 18px;
    }

    .digital-clock {
      padding: 18px;
      border-radius: 18px;
      background: #eff6ff;
    }

    .digital-time {
      margin: 0;
      font-size: clamp(32px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .digital-date {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .analog-clock-wrap {
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }

    .analog-clock {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, white 0 62%, transparent 63%),
        conic-gradient(from -90deg, #dbeafe 0deg 30deg, #bfdbfe 30deg 60deg, #dbeafe 60deg 90deg, #bfdbfe 90deg 120deg, #dbeafe 120deg 150deg, #bfdbfe 150deg 180deg, #dbeafe 180deg 210deg, #bfdbfe 210deg 240deg, #dbeafe 240deg 270deg, #bfdbfe 270deg 300deg, #dbeafe 300deg 330deg, #bfdbfe 330deg 360deg);
      border: 8px solid #dbeafe;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
    }

    .analog-clock::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(37, 99, 235, 0.12);
    }

    .center-dot {
      position: absolute;
      inset: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--primary);
      z-index: 5;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: center bottom;
      border-radius: 999px;
    }

    .hour-hand {
      width: 8px;
      height: 58px;
      margin-left: -4px;
      background: #0f172a;
    }

    .minute-hand {
      width: 6px;
      height: 82px;
      margin-left: -3px;
      background: #2563eb;
    }

    .second-hand {
      width: 2px;
      height: 92px;
      margin-left: -1px;
      background: #ef4444;
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 12px;
      width: 3px;
      height: 14px;
      margin-left: -1.5px;
      background: rgba(37, 99, 235, 0.45);
      transform-origin: center 98px;
      border-radius: 999px;
    }

    .tick.major {
      width: 4px;
      height: 18px;
      margin-left: -2px;
      background: rgba(15, 23, 42, 0.7);
    }

    .settings {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .setting {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .setting select {
      min-width: 0;
      padding: 12px 14px;
      font-size: 14px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 820px) {
      .settings {
        grid-template-columns: 1fr;
      }

      .analog-clock {
        width: 190px;
        height: 190px;
      }

      .hour-hand { height: 48px; }
      .minute-hand { height: 68px; }
      .second-hand { height: 78px; }
      .tick { transform-origin: center 83px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>🌍 세계 시계</h1>
        <p>원하는 지역을 추가하고 아날로그/디지털, 12시간/24시간, AM/PM 표시를 원하는 대로 바꿔보세요.</p>
      </div>
    </section>

    <section class="toolbar" aria-label="세계 시계 추가">
      <select id="timezoneSelect" aria-label="지역 선택"></select>
      <button class="add-button" id="addClockButton" type="button">＋ 시계 추가</button>
    </section>

    <section class="clock-grid" id="clockGrid" aria-live="polite"></section>
  </main>

  <script>
    const STORAGE_KEY = "world-clock-dashboard";
    const locations = [
      { label: "서울", description: "대한민국 · Asia/Seoul", timezone: "Asia/Seoul" },
      { label: "도쿄", description: "일본 · Asia/Tokyo", timezone: "Asia/Tokyo" },
      { label: "싱가포르", description: "싱가포르 · Asia/Singapore", timezone: "Asia/Singapore" },
      { label: "두바이", description: "UAE · Asia/Dubai", timezone: "Asia/Dubai" },
      { label: "런던", description: "영국 · Europe/London", timezone: "Europe/London" },
      { label: "파리", description: "프랑스 · Europe/Paris", timezone: "Europe/Paris" },
      { label: "뉴욕", description: "미국 동부 · America/New_York", timezone: "America/New_York" },
      { label: "로스앤젤레스", description: "미국 서부 · America/Los_Angeles", timezone: "America/Los_Angeles" },
      { label: "상파울루", description: "브라질 · America/Sao_Paulo", timezone: "America/Sao_Paulo" },
      { label: "시드니", description: "호주 · Australia/Sydney", timezone: "Australia/Sydney" }
    ];

    const timezoneSelect = document.getElementById("timezoneSelect");
    const addClockButton = document.getElementById("addClockButton");
    const clockGrid = document.getElementById("clockGrid");

    let clocks = loadClocks();

    locations.forEach(location => {
      timezoneSelect.add(new Option(`${location.label} (${location.timezone})`, location.timezone));
    });

    addClockButton.addEventListener("click", () => {
      addClock(timezoneSelect.value);
    });

    function loadClocks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(saved) && saved.length > 0) {
          return saved.map(normalizeClock).filter(Boolean);
        }
      } catch (error) {
      }
      return [createClock("Asia/Seoul")];
    }

    function normalizeClock(clock) {
      const location = locations.find(item => item.timezone === clock.timezone);
      if (!location) return null;
      return {
        id: clock.id || String(Date.now() + Math.random()),
        timezone: location.timezone,
        label: location.label,
        description: location.description,
        displayMode: ["analog", "digital", "both"].includes(clock.displayMode) ? clock.displayMode : "both",
        hourCycle: clock.hourCycle === "12" ? "12" : "24",
        showAmPm: Boolean(clock.showAmPm)
      };
    }

    function createClock(timezone) {
      const location = locations.find(item => item.timezone === timezone) || locations[0];
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        timezone: location.timezone,
        label: location.label,
        description: location.description,
        displayMode: "both",
        hourCycle: "24",
        showAmPm: false
      };
    }

    function saveClocks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clocks));
    }

    function addClock(timezone) {
      clocks.push(createClock(timezone));
      saveClocks();
      renderClocks();
    }

    function removeClock(id) {
      clocks = clocks.filter(clock => clock.id !== id);
      if (clocks.length === 0) {
        clocks = [createClock("Asia/Seoul")];
      }
      saveClocks();
      renderClocks();
    }

    function updateClock(id, key, value) {
      clocks = clocks.map(clock => clock.id === id ? { ...clock, [key]: value } : clock);
      saveClocks();
      renderClocks();
    }

    function buildTicks() {
      return Array.from({ length: 12 }, (_, index) => {
        const angle = index * 30;
        const major = index % 3 === 0 ? " major" : "";
        return `<span class="tick${major}" style="transform: rotate(${angle}deg);"></span>`;
      }).join("");
    }

    function renderClocks() {
      if (clocks.length === 0) {
        clockGrid.innerHTML = '<div class="empty-state">지역을 선택한 뒤 ＋ 버튼으로 시계를 추가하세요.</div>';
        return;
      }

      clockGrid.innerHTML = clocks.map(clock => `
        <article class="clock-card" data-clock-id="${clock.id}">
          <div class="clock-header">
            <div>
              <h2>${clock.label}</h2>
              <p>${clock.description}</p>
            </div>
            <button class="remove-button" data-action="remove" data-id="${clock.id}" type="button" aria-label="${clock.label} 시계 삭제">×</button>
          </div>

          <div class="clock-body">
            <section class="digital-clock ${clock.displayMode === "analog" ? "hidden" : ""}">
              <p class="digital-time" data-role="digital-time"></p>
              <p class="digital-date" data-role="digital-date"></p>
            </section>

            <div class="analog-clock-wrap ${clock.displayMode === "digital" ? "hidden" : ""}">
              <div class="analog-clock" aria-hidden="true">
                ${buildTicks()}
                <span class="hand hour-hand" data-role="hour-hand"></span>
                <span class="hand minute-hand" data-role="minute-hand"></span>
                <span class="hand second-hand" data-role="second-hand"></span>
                <span class="center-dot"></span>
              </div>
            </div>
          </div>

          <div class="settings">
            <label class="setting">
              <span>표시 방식</span>
              <select data-action="display-mode" data-id="${clock.id}">
                <option value="both" ${clock.displayMode === "both" ? "selected" : ""}>아날로그 + 디지털</option>
                <option value="digital" ${clock.displayMode === "digital" ? "selected" : ""}>디지털</option>
                <option value="analog" ${clock.displayMode === "analog" ? "selected" : ""}>아날로그</option>
              </select>
            </label>

            <label class="setting">
              <span>시간 표기</span>
              <select data-action="hour-cycle" data-id="${clock.id}">
                <option value="24" ${clock.hourCycle === "24" ? "selected" : ""}>24시간</option>
                <option value="12" ${clock.hourCycle === "12" ? "selected" : ""}>12시간</option>
              </select>
            </label>

            <label class="setting">
              <span>AM / PM</span>
              <span class="toggle">
                <span>${clock.hourCycle === "24" ? "24시간일 때 숨김" : "오전/오후 표시"}</span>
                <input type="checkbox" data-action="ampm" data-id="${clock.id}" ${clock.showAmPm ? "checked" : ""} ${clock.hourCycle === "24" ? "disabled" : ""}>
              </span>
            </label>
          </div>
        </article>
      `).join("");

      clockGrid.querySelectorAll("[data-action='remove']").forEach(button => {
        button.addEventListener("click", () => removeClock(button.dataset.id));
      });

      clockGrid.querySelectorAll("[data-action='display-mode']").forEach(select => {
        select.addEventListener("change", () => updateClock(select.dataset.id, "displayMode", select.value));
      });

      clockGrid.querySelectorAll("[data-action='hour-cycle']").forEach(select => {
        select.addEventListener("change", () => {
          const id = select.dataset.id;
          const value = select.value;
          clocks = clocks.map(clock => clock.id === id ? { ...clock, hourCycle: value, showAmPm: value === "24" ? false : clock.showAmPm } : clock);
          saveClocks();
          renderClocks();
        });
      });

      clockGrid.querySelectorAll("[data-action='ampm']").forEach(input => {
        input.addEventListener("change", () => updateClock(input.dataset.id, "showAmPm", input.checked));
      });

      tick();
    }

    function getClockParts(timezone) {
      const now = new Date();
      const timeParts = new Intl.DateTimeFormat("en-GB", {
        timeZone: timezone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(now);

      const values = Object.fromEntries(timeParts.filter(part => part.type !== "literal").map(part => [part.type, part.value]));

      return {
        hour: Number(values.hour),
        minute: Number(values.minute),
        second: Number(values.second),
        dateText: new Intl.DateTimeFormat("ko-KR", {
          timeZone: timezone,
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(now)
      };
    }

    function formatDigitalTime(clock, parts) {
      const minutes = String(parts.minute).padStart(2, "0");
      const seconds = String(parts.second).padStart(2, "0");

      if (clock.hourCycle === "24") {
        return `${String(parts.hour).padStart(2, "0")}:${minutes}:${seconds}`;
      }

      const hour12 = parts.hour % 12 || 12;
      const prefix = parts.hour < 12 ? "AM" : "PM";
      return `${clock.showAmPm ? `${prefix} ` : ""}${String(hour12).padStart(2, "0")}:${minutes}:${seconds}`;
    }

    function updateClockVisuals(clock) {
      const card = clockGrid.querySelector(`[data-clock-id="${clock.id}"]`);
      if (!card) return;

      const parts = getClockParts(clock.timezone);
      const digitalTime = card.querySelector("[data-role='digital-time']");
      const digitalDate = card.querySelector("[data-role='digital-date']");
      const hourHand = card.querySelector("[data-role='hour-hand']");
      const minuteHand = card.querySelector("[data-role='minute-hand']");
      const secondHand = card.querySelector("[data-role='second-hand']");

      if (digitalTime) digitalTime.textContent = formatDigitalTime(clock, parts);
      if (digitalDate) digitalDate.textContent = parts.dateText;

      const hourAngle = ((parts.hour % 12) + parts.minute / 60 + parts.second / 3600) * 30;
      const minuteAngle = (parts.minute + parts.second / 60) * 6;
      const secondAngle = parts.second * 6;

      if (hourHand) hourHand.style.transform = `rotate(${hourAngle}deg)`;
      if (minuteHand) minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
      if (secondHand) secondHand.style.transform = `rotate(${secondAngle}deg)`;
    }

    function tick() {
      clocks.forEach(updateClockVisuals);
    }

    renderClocks();
    setInterval(tick, 1000);
  </script>
</body>
</html>
